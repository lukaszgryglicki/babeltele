[package]
name = "babeltele"
version = "0.1.0"
edition = "2021"
description = "UNIX filter that autodetects its input and translates it into BabelTele — LLM-native, high-density text (arXiv:2606.19857)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lukaszgryglicki/babeltele"
keywords = ["llm", "compression", "cli", "prompt", "babeltele"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tiktoken-rs = "0.12.0"
whatlang = "0.18.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
